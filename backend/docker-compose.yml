version: '3.8'

services:
  resume-projects-mcp:
    build: ./mcp
    container_name: portfolio-resume-projects-mcp
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - POCKETBASE_URL=https://www.thomasgriffin.dev
    restart: unless-stopped

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest # Multi-arch (AMD64/ARM64)
    container_name: portfolio-pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    environment:
      - TZ=UTC
    restart: unless-stopped
    # Internal command to ensure it listens to the Docker network
    command: ["serve", "--http=0.0.0.0:8090"]

volumes:
  pocketbase_data:
